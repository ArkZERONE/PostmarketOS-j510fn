name: Build pmOS J5 2016

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv git curl wget e2fsprogs

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          pmbootstrap --version

      - name: Configure pmbootstrap
        run: |
          pmbootstrap -y config device samsung-j5x
          pmbootstrap -y config ui xfce4
          pmbootstrap -y config user user
          pmbootstrap -y config hostname j5pmos
          pmbootstrap -y config sshd false

      - name: Initialize pmbootstrap
        run: |
          pmbootstrap -y init

      - name: Build kernel and packages
        run: |
          pmbootstrap -y build --arch armv7

      - name: Install rootfs
        run: |
          pmbootstrap -y install --split

      - name: Export artifacts
        run: |
          pmbootstrap -y export
          mkdir -p output
          cp -L /tmp/postmarketOS-export/boot.img output/boot.img 2>/dev/null || true
          cp -L /tmp/postmarketOS-export/*.img output/ 2>/dev/null || true
          find ~/.local/var/pmbootstrap -type f -name "*.img" -exec cp -L {} output/ \; 2>/dev/null || true
          echo "=== Files in output ==="
          ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-j5x-images
          path: output/
          retention-days: 7
          if-no-files-found: warn
