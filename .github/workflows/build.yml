name: Build pmOS J5 2016

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv git curl wget e2fsprogs openssl

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create pmbootstrap config
        run: |
          mkdir -p ~/.config
          cat << EOF > ~/.config/pmbootstrap.cfg
          [pmbootstrap]
          aports = $HOME/.local/var/pmbootstrap/cache_git/pmaports
          cachedir = $HOME/.local/var/pmbootstrap
          device = samsung-j5x
          extra_space = 0
          is_default_channel = True
          jobs = 5
          kernel = stable
          keymap = us
          locale = en_US.UTF-8
          mirrors_alpine = http://dl-cdn.alpinelinux.org/alpine/
          nonfree_firmware = True
          nonfree_userland = True
          ssh_keys = False
          timezone = UTC
          ui = xfce4
          user = user
          vendor = samsung
          workdir = $HOME/.local/var/pmbootstrap
          EOF
          echo "=== Config file check ==="
          cat ~/.config/pmbootstrap.cfg

      - name: Initialize pmbootstrap
        run: |
          pmbootstrap -y init

      - name: Build kernel and packages
        run: |
          pmbootstrap -y build --arch armv7

      - name: Install rootfs
        run: |
          pmbootstrap -y install --split

      - name: Export artifacts
        run: |
          pmbootstrap -y export
          mkdir -p output
          cp -L /tmp/postmarketOS-export/boot.img output/boot.img 2>/dev/null || true
          cp -L /tmp/postmarketOS-export/*.img output/ 2>/dev/null || true
          find ~/.local/var/pmbootstrap -type f -name "*.img" -exec cp -L {} output/ \; 2>/dev/null || true
          echo "=== Files in output ==="
          ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-j5x-images
          path: output/
          retention-days: 7
          if-no-files-found: warn
